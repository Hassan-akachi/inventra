name: inventra
description: Offline-first inventory and sales management.
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  powersync: ^1.9.0
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  pdf: ^3.11.1
  printing: ^5.13.4
  supabase_flutter: ^2.8.4
  http: ^1.2.2
  share_plus: ^10.1.4

# The pdf/printing packages pull in `image`. image 4.6+ calls
# ZLibDecoder.decodeLazy, which older `archive` versions don't have.
# Pinning image keeps the build working whatever archive version resolves.
dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/branding/
